services:
  - type: web
    name: witan-voting
    runtime: node
    buildCommand: npm install --include=dev && npm run db:deploy && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
